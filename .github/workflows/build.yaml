name: build

"on":
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
